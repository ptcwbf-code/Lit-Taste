<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读口味 · 文学契合测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">

    <header class="masthead">
      <span class="wordmark">阅读口味 · Reading Profile</span>
      <span class="meta">十维测量</span>
    </header>

    <!-- 开场 -->
    <section id="intro" class="screen">
      <svg class="mark-lg" viewBox="0 0 48 48" aria-hidden="true">
        <g stroke="currentColor" fill="none" stroke-width="1">
          <line x1="24" y1="2" x2="24" y2="46"/>
          <line x1="2" y1="24" x2="46" y2="24"/>
          <line x1="8.4" y1="8.4" x2="39.6" y2="39.6"/>
          <line x1="39.6" y1="8.4" x2="8.4" y2="39.6"/>
          <circle cx="24" cy="24" r="6"/>
          <circle cx="24" cy="24" r="16" stroke-width="0.5" opacity="0.6"/>
        </g>
      </svg>
      <p class="kicker">Literary Profile</p>
      <h1>找到与你最契合的作家</h1>
      <p class="lead">你将面对几个不同的文学情境，做出你的选择。没有对错，只有偏好。</p>
      <div class="howto">
        每题可选 <strong>1 或 2 个</strong>选项，勾选顺序就是优先顺序：先选的算「第一选择」（更贴合你，权重更高），后选的算「第二选择」（次之，权重减半）。
      </div>
      <div class="modes">
        <button class="mode" data-count="16"><strong>精简版</strong><span>16 题 · 约 3 分钟</span></button>
        <button class="mode selected" data-count="24"><strong>标准版</strong><span>24 题 · 约 5 分钟</span></button>
        <button class="mode" data-count="32"><strong>精确版</strong><span>32 题 · 更精确</span></button>
        <button class="mode" data-count="99"><strong>全题库</strong><span>48 题 · 全部做完</span></button>
      </div>
      <button id="startBtn" class="primary">开始测试</button>
      <button id="historyBtn" class="link">历史结果 →</button>
    </section>

    <!-- 答题 -->
    <section id="quiz" class="screen hidden">
      <div class="progress">
        <div class="progress-top">
          <span id="progressText">1 / 24</span>
          <span>最多 2 项 · 先选优先</span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>
      <div id="scenario"></div>
    </section>

    <!-- 结果 -->
    <section id="results" class="screen hidden">
      <div id="resultsBody"></div>
      <button id="restartBtn" class="ghost">再做一次</button>
    </section>

    <!-- 历史 -->
    <section id="history" class="screen hidden">
      <p class="kicker">Past Readings</p>
      <h1>历史结果</h1>
      <div id="historyBody"></div>
      <button id="backBtn" class="ghost">返回</button>
    </section>

    <footer class="foot">
      <span>一个关于阅读口味的小实验</span>
    </footer>

  </main>
  <script src="app.js"></script>
</body>
</html>
