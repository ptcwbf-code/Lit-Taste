<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试台 · 找到与你最契合的人</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">

    <header class="masthead">
      <span class="wordmark" id="wordmark">测试台 · Quiz Platform</span>
      <button id="homeBtn" class="link home-link">← 全部测试</button>
    </header>

    <!-- 目录 / 首页 -->
    <section id="catalog" class="screen">
      <p class="kicker">Quiz Platform</p>
      <h1>选一个测试</h1>
      <p class="lead">每个测试会给你几个情境，你凭直觉选。没有对错，只有偏好。</p>
      <div id="catalogBody" class="catalog"></div>
    </section>

    <!-- 开场（某个测试的入口，内容由 JS 填充） -->
    <section id="intro" class="screen hidden">
      <p class="kicker" id="introKicker"></p>
      <h1 id="introHeading"></h1>
      <p class="lead" id="introLead"></p>
      <div class="modes" id="modes"></div>
      <button id="startBtn" class="primary">开始测试</button>
      <br>
      <button id="historyBtn" class="link">历史结果 →</button>
    </section>

    <!-- 答题 -->
    <section id="quiz" class="screen hidden">
      <div class="progress">
        <div class="progress-top">
          <span id="progressText">1 / 24</span>
          <span>每题选一项</span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>
      <div id="scenario"></div>
    </section>

    <!-- 结果 -->
    <section id="results" class="screen hidden">
      <div id="resultsBody"></div>
      <button id="restartBtn" class="ghost">再做一次</button>
    </section>

    <!-- 历史 -->
    <section id="history" class="screen hidden">
      <p class="kicker">Past Results</p>
      <h1 id="historyTitle">历史结果</h1>
      <div id="historyBody"></div>
      <button id="backBtn" class="ghost">返回</button>
    </section>

    <footer class="foot">
      <span>一个关于"你"的小实验 · Node + Express + PostgreSQL</span>
    </footer>

  </main>
  <script src="app.js"></script>
</body>
</html>
